version: '3.8'

services:
  paypal-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    environment:
      - SERVICE_PORT=3006
      - SERVICE_NAME=cogquiz-paypal-service
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-secret}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-secret-key}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    networks:
      - cogquiz-network

networks:
  cogquiz-network:
    driver: bridge
